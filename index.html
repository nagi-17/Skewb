<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skewb</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="top-bar">
        <img src="https://yt3.googleusercontent.com/ytc/AIdro_lp5RPKxsgc_GGP5150cfSRPkVTKTV-DCDvII-EcX_c3QU=s160-c-k-c0x00ffffff-no-rj" alt="Logo" width="50" height="50"> 
        <div class="draw-tools">
            <button id="select" class="active">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg></span>
                <span class="shortcut">1</span>
            </button>
            <button id="brush">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg></span>
                <span class="shortcut">2</span>
            </button>
            <button id="eraser">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"/></svg></span>
                <span class="shortcut">3</span>
            </button>
            <button id="line">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/></svg></span>
                <span class="shortcut">4</span>
            </button>
            <button id="rectangle">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg></span>
                <span class="shortcut">5</span>
            </button>
            <button id="circle">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg></span>
                <span class="shortcut">6</span>
            </button>
            <button id="triangle">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 22h20L12 2z"/></svg></span>
                <span class="shortcut">7</span>
            </button>
            <button id="text">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg></span>
                <span class="shortcut">8</span>
            </button>
            <button id="image">
                <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
                <span class="shortcut">9</span>
            </button>
        </div>
    </header>

    <div id="workspace-container">

        <main id="canvas-container">
            <canvas id="drawing-board"></canvas>
        </main>

        <aside id="properties-panel">
            <div class="property-group">
                <label for="stroke-color">STROKE COLOR:</label>
                <input type="color" id="stroke-color" value="#000000">

                <label for="stroke-width">STROKE WIDTH:</label>
                <input type="range" id="stroke-width" min="1" max="50" value="5">

                <label for="opacity">OPACITY:</label>
                <input type="range" id="opacity" min="0" max="1" step="0.1" value="1">

                <label for="stroke-style">STROKE STYLE</label>
                <div class="style-buttons">
                    <button id="style-solid" class="active">Solid</button>
                    <button id="style-dashed">Dashed</button>
                    <button id="style-dotted">Dotted</button>
                </div>
            </div>
        </aside>

    </div>

    <footer id="bottom-bar">
        <div class="controls">
            <button id="theme">Toggle Mode</button>
            <button id="undo">Undo</button>
            <button id="redo">Redo</button>
            <button id="clear">Clear Canvas</button>
            <button id="delete-button">Delete</button>
        </div>
    </footer>

    <script src="func.js"></script>
</body>
</html>
